# Eileen Alexander | Netlify config (Live Web Studios)
[build]
  # The site lives in build/. Docs, tests and the function source stay outside it.
  publish = "build"
  # No build step. Netlify installs package.json deps automatically for the function.
  command = "echo static site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["build/data/products.json"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/data/products.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
